[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jp15"
version = "0.2.0"
description = "Python bindings for OpenJPH HTJ2K encode/decode"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "BSD-2-Clause" }
authors = [{ name = "Alessandro A. Grande" }]
dependencies = ["numpy>=2,<3"]

[project.optional-dependencies]
zarr = ["zarr>=3.1.3"]
simplezarr = ["simplezarr>=1.1"]
test = ["pytest>=8", "zarr>=3.1.3", "simplezarr>=1.1"]
dev = ["pre-commit>=4.3"]

[project.entry-points."zarr.codecs"]
openjph_htj2k = "jp15.codecs.zarr:OpenJPHCodec"

[project.entry-points."simplezarr.codecs"]
openjph_htj2k = "jp15.codecs.simplezarr:OpenJPHSimplezarrCodec"

[tool.hatch.build.targets.wheel]
packages = ["jp15"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["F", "E", "W", "N", "B", "RUF"]
ignore = [
    "E501",   # Line too long
    "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
    "RUF022", # __all__ is not sorted
    "N806",   # Variable `X` in function should be lowercase
]
